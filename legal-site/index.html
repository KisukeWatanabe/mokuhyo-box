<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>目標BOX</title>
  <style>
    :root {
      --bg: #F3ECDB;
      --card: #FFFDF5;
      --ink: #40372A;
      --ink-soft: #6E6250;
      --muted: #AC9F87;
      --accent: #BC5B37;
      --border: #E5DAC2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px 64px;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
        "Noto Sans JP", "Yu Gothic", sans-serif;
      line-height: 1.9;
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 32px 28px 40px;
    }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 32px 0 8px; color: var(--accent); }
    p { margin: 0 0 12px; }
    ul { margin: 4px 0 16px; padding-left: 1.3em; }
    li { margin-bottom: 4px; }
    a { color: var(--accent); }
    .lead { color: var(--ink-soft); margin-bottom: 8px; }
    .meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 24px; }
    .back { display: inline-block; margin-top: 32px; font-size: 0.9rem; }
    @media (max-width: 480px) {
      body { padding: 16px 12px 48px; }
      main { padding: 24px 18px 32px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main>
      <h1>目標BOX</h1>
      <p class="meta">最終更新日: 2026年8月1日</p>
      <p class="lead">大きな目標を日々の行動まで分解して管理する iPhone アプリです。</p>

      <h2>各種文書</h2>
      <ul>
        <li><a href="./privacy.html">プライバシーポリシー</a></li>
        <li><a href="./terms.html">利用規約</a></li>
      </ul>

      <h2>お問い合わせ</h2>
      <p>渡辺喜介<br><a href="mailto:wkisuke0122@icloud.com">wkisuke0122@icloud.com</a></p>
  </main>
</body>
</html>
